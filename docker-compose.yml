services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xiclash
      POSTGRES_PASSWORD: xiclash
      POSTGRES_DB: xiclash
    ports:
      - "5432:5432"
    volumes:
      - xiclash_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  xiclash_pg_data: